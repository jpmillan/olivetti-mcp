issue_type: Task
default_priority: Medium
required_fields:
  - summary
  - description
field_labels:
  - task
description_template: |
  ## 🧾 Summary

  {description}

  ## ✅ Acceptance Criteria

  {acceptance_criteria}

  ## 🔗 Dependencies

  {dependencies}

  ## 🏁 Definition of Done

  - [ ] Task objective/scope is completed as defined
  - [ ] Any related code/configuration is completed and reviewed
  - [ ] Code is merged and builds successfully (if applicable)
  - [ ] Relevant tests or validations are completed
  - [ ] No outstanding issues or rework identified
  - [ ] Documentation/configuration updated where required
  - [ ] Outcome is verified by the assignee and/or reviewer
